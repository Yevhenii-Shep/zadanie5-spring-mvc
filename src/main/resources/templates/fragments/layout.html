<!DOCTYPE html>
<html lang="sk" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title th:text="${title} + ' · Staffbook'">Staffbook</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header th:fragment="header" class="topbar">
	<div class="topbar__inner">
		<a class="brand" th:href="@{/employees}">
			<span class="brand__mark">S</span>
			<span class="brand__name">Staffbook</span>
		</a>
		<nav class="topbar__nav">
			<a th:href="@{/employees}">Zamestnanci</a>
			<a class="btn btn--primary btn--sm" th:href="@{/employees/create}">
				<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
				Nový zamestnanec
			</a>
		</nav>
	</div>
</header>

<div th:fragment="flash" th:if="${message}" class="flash" role="status">
	<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
	<span th:text="${message}">Správa</span>
</div>

<!-- Vlastny potvrdzovaci dialog namiesto skaredeho confirm() -->
<th:block th:fragment="deleteDialog">
	<dialog id="deleteDialog" class="dialog">
		<form method="post" id="deleteForm" class="dialog__body">
			<div class="dialog__icon">
				<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/></svg>
			</div>
			<h3>Odstrániť zamestnanca?</h3>
			<p>Naozaj chcete odstrániť zamestnanca <strong id="deleteName"></strong>? Túto akciu nie je možné vrátiť späť.</p>
			<div class="dialog__actions">
				<button type="button" class="btn btn--ghost" id="deleteCancel">Zrušiť</button>
				<button type="submit" class="btn btn--danger">Odstrániť</button>
			</div>
		</form>
	</dialog>
	<script>
		(() => {
			const dialog = document.getElementById('deleteDialog');
			const form = document.getElementById('deleteForm');
			document.querySelectorAll('[data-delete-url]').forEach(btn => {
				btn.addEventListener('click', () => {
					form.action = btn.dataset.deleteUrl;
					document.getElementById('deleteName').textContent = btn.dataset.deleteName;
					dialog.showModal();
				});
			});
			document.getElementById('deleteCancel').addEventListener('click', () => dialog.close());
			dialog.addEventListener('click', e => { if (e.target === dialog) dialog.close(); });
		})();
	</script>
</th:block>

</body>
</html>
