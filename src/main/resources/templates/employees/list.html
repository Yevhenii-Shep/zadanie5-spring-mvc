<!DOCTYPE html>
<html lang="sk" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Zamestnanci')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="page">
	<div th:replace="~{fragments/layout :: flash}"></div>

	<section class="page-head">
		<div>
			<p class="eyebrow">Adresár</p>
			<h1>Zamestnanci</h1>
			<p class="muted">
				<span th:text="${#lists.size(employees)}">0</span> ľudí v tíme
			</p>
		</div>
		<label class="search">
			<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
			<input type="search" id="search" placeholder="Hľadať meno, pozíciu, email…">
		</label>
	</section>

	<div class="card table-card">
		<table class="table">
			<thead>
			<tr>
				<th>Zamestnanec</th>
				<th>Pozícia</th>
				<th>Úväzok</th>
				<th class="hide-sm">Dátum narodenia</th>
				<th class="hide-md">Kontakt</th>
				<th class="right">Akcia</th>
			</tr>
			</thead>
			<tbody>
			<tr th:each="employee : ${employees}" class="row">
				<td>
					<a class="person" th:href="@{'/employees/' + ${employee.id}}">
						<span class="avatar" th:classappend="'tone-' + ${employee.id % 5}"
							  th:text="${employee.initials}">JN</span>
						<span>
							<strong th:text="${employee.firstName + ' ' + employee.lastName}">Jozef Novák</strong>
						</span>
					</a>
				</td>
				<td th:text="${employee.jobTitle}">Software Engineer</td>
				<td>
					<span class="badge" th:classappend="'type-' + ${employee.fullTime}"
						  th:text="${employmentTypes[employee.fullTime]}">Full-time</span>
				</td>
				<td class="hide-sm nowrap" th:text="${#temporals.format(employee.birthDate, 'dd. MM. yyyy')}">15. 04. 1992</td>
				<td class="hide-md muted" th:text="${employee.email}">jozef.novak@ukf.sk</td>
				<td class="right">
					<div class="actions">
						<a class="icon-btn" th:href="@{'/employees/' + ${employee.id}}" title="Detail" aria-label="Detail">
							<svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
						</a>
						<a class="icon-btn" th:href="@{'/employees/' + ${employee.id} + '/edit'}" title="Upraviť" aria-label="Upraviť">
							<svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4ZM13.5 6.5l4 4"/></svg>
						</a>
						<button type="button" class="icon-btn icon-btn--danger" title="Vymazať" aria-label="Vymazať"
								th:attr="data-delete-url=@{'/employees/' + ${employee.id} + '/delete'},data-delete-name=${employee.firstName + ' ' + employee.lastName}">
							<svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>
						</button>
					</div>
				</td>
			</tr>
			</tbody>
		</table>
		<p class="empty" th:if="${#lists.isEmpty(employees)}">Zatiaľ tu nie sú žiadni zamestnanci.</p>
		<p class="empty" id="noResults" hidden>Nič sa nenašlo.</p>
	</div>
</main>

<th:block th:replace="~{fragments/layout :: deleteDialog}"></th:block>
<script>
	(() => {
		const input = document.getElementById('search');
		const rows = [...document.querySelectorAll('tbody .row')];
		const none = document.getElementById('noResults');
		input.addEventListener('input', () => {
			const q = input.value.trim().toLowerCase();
			let shown = 0;
			rows.forEach(r => {
				const hit = r.textContent.toLowerCase().includes(q);
				r.hidden = !hit;
				if (hit) shown++;
			});
			none.hidden = shown !== 0 || rows.length === 0;
		});
	})();
</script>
</body>
</html>
