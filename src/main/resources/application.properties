spring.application.name=mvc

# --- Pripojenie k DB (XAMPP / phpMyAdmin) ---
spring.datasource.url=jdbc:mysql://localhost:3306/employee_directory
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# --- Hodnoty pre drop-down list (job_title) ---
employee.job-titles=Software Engineer,Data Analyst,Product Manager,Marketing Specialist,System Administrator,UX Designer,DevOps Engineer,Front-End Developer,Back-End Developer,Project Manager,QA Tester,Product Owner

# --- Hodnoty pre radio buttony (full_time) ---
# kluc = hodnota ulozena v DB stlpci full_time (TINYINT), hodnota = text zobrazeny pouzivatelovi
employee.employment-types={1:'Full-time', 0:'Part-time', 2:'Contract', 3:'Intern/Trainee'}
